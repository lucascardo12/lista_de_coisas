name: listadecoisa
description: App simples para todo tipo de listas.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.2+28

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.1.2
  fluttertoast: ^9.0.0
  firebase_auth: ^6.1.4
  translator: ^1.0.4+1
  google_sign_in: ^7.2.0
  share_plus: ^12.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  package_info_plus: ^9.0.0
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  get_it: ^9.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  currency_text_input_formatter: ^2.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  image: assets/test.png
  color: "FF406F"
  android_disable_fullscreen: false
  fill: false
# flutter pub run flutter_launcher_icons:main

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"

# flutter pub run flutter_native_splash:create
flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/
